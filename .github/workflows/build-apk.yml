name: Build APK
on:
  push:
    paths: ['smcvision*.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir app
          unzip -q -o "$(ls smcvision*.zip | sort -V | tail -1)" -d app
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Build debug APK
        working-directory: app/smcvision
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SMCVision-apk
          path: app/smcvision/android/app/build/outputs/apk/debug/*.apk
